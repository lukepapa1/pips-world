<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b7d4ea" />
    <title>Pip's World</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #b7d4ea;
        color: #2a241c;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      main {
        width: min(420px, 100%);
        background: #f6f0e4;
        border-radius: 22px;
        padding: 28px 24px;
        box-shadow: 0 16px 40px rgba(48, 32, 16, 0.16);
        text-align: center;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 1.7rem;
        line-height: 1.2;
        margin: 0 0 8px;
        text-wrap: balance;
      }
      p { margin: 0; color: #7a6e60; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pip's village is waking up</h1>
      <p>The path to the village is quiet. It will be here when the connection comes back.</p>
    </main>
  </body>
</html>
