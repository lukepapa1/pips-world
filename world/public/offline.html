<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b7d4ea" />
    <title>Pip's World</title>
    <style>
      :root { color-scheme: light; --ink: #2a241c; --ink-soft: #5c5146; --paper: #f6f0e4; --sky: #b7d4ea; --shadow: 0 12px 32px rgba(48, 32, 16, 0.14); }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --ink: #f6f0e4; --ink-soft: #d4c6b4; --paper: #241e18; --sky: #1c2830; --shadow: 0 12px 32px rgba(0, 0, 0, 0.35); }
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--sky);
        color: var(--ink);
        font-family: "Source Sans 3", "Avenir Next", "Segoe UI", sans-serif;
        font-size: 16px;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      main {
        width: min(420px, 100%);
        background: var(--paper);
        border-radius: 22px;
        padding: 32px 24px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      h1 {
        font-family: Nunito, "Avenir Next", sans-serif;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
        margin: 0 0 8px;
        text-wrap: balance;
      }
      p { margin: 0; color: var(--ink-soft); line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pip's village is waking up</h1>
      <p>The path to the village is quiet. It will be here when the connection comes back.</p>
    </main>
  </body>
</html>
